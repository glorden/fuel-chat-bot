# Список известных АЗС. У каждой станции: id (используется в БД/коде),
# name (для будущих ответов бота), brand (канонический бренд — по нему
# считается неоднозначность), address, brand_aliases (по каким словам
# резолвер узнаёт бренд) и location_aliases (по каким словам — именно
# эту точку). pipeline/resolve_station.py матчит станцию, если в тексте
# есть её brand_alias, а если у бренда несколько станций — то ещё и её
# location_alias. Бренд с единственной точкой (пока только Опти — Газпром
# см. ниже) резолвится по одному brand_alias, без уточнения локации.
# default_for_brand: true — необязательное поле, станция-умолчание для
# своего бренда: если бренд назван, но НИ ОДНА его станция (включая эту)
# не подошла по локации, резолвер вернёт именно её вместо null. Сейчас
# только у gazprom (Петрозаводск) — подтверждено пользователем 2026-08-10,
# что голое "Газпром" в чате однозначно про Петрозаводск, даже после того
# как появилась вторая точка бренда вне города (gazprom_berezovka).
# Лимиты отпуска топлива "в одни руки" по бренду — по прямому сообщению
# пользователя 2026-08-15. Это НЕ то же самое, что таблица fuel_limit в БД
# (см. CLAUDE.md/ARCHITECTURE.md): там — факты, о которых реально написали
# в чате, привязанные к конкретной станции, без окна активности. Здесь —
# статичное значение на весь бренд сразу, известное заранее, а не из чата.
# Нужно это отдельно от fuel_limit потому, что у Роснефти/Татнефти/Лукойла
# по нескольку точек, и голое упоминание бренда без адреса ("сколько дают
# на РН?") не резолвится ни в одну конкретную станцию (см. resolve_station()
# ниже) — но сам лимит одинаков на все точки бренда, так что резолвить
# станцию для ответа не требуется. Бренды без записи здесь — лимит просто
# неизвестен, вопрос без резолва станции останется без ответа, как и раньше.
brand_fuel_limits:
  Роснефть: 30
  Татнефть: 50
  Лукойл: 40

stations:
  # Также известна как "у автофорума", "на радиозаводе", "на объездной"
  # (подтверждено пользователем в чате 2026-08-10). Алиас "объездн" также
  # используется у tatneft_silikatny и rosneft_lesnoy_79 — не конфликт,
  # бренд разный, резолвер матчит независимо.
  - id: lukoil_lesnoy
    name: "Лукойл (Лесной просп.)"
    brand: "Лукойл"
    address: "Лесной просп."
    brand_aliases: ["лукойл"]
    location_aliases: ["лесн", "объездн", "автофорум", "радиозавод"]

  - id: lukoil_lososinskoe
    name: "Лукойл (Лососинское шоссе)"
    brand: "Лукойл"
    address: "Лососинское шоссе"
    brand_aliases: ["лукойл"]
    # "лоссосинск" — реальный опечаточный вариант написания, встретился в переписке.
    # "цск"/"чист" (у ЦСК, на Чистой) — подтверждено пользователем 2026-08-10.
    location_aliases: ["лососинск", "лоссосинск", "цск", "чист"]

  - id: lukoil_vilga
    name: "Лукойл (Вилга)"
    brand: "Лукойл"
    address: "Вилга"
    brand_aliases: ["лукойл"]
    location_aliases: ["вилг"]

  # Объединена с бывшей отдельной записью lukoil_zavodskaya — пользователь
  # подтвердил 2026-08-10, что это одна и та же станция ("Шуйское"/"Заводская").
  - id: lukoil_shuyskoe
    name: "Лукойл (Шуйское шоссе / Заводская)"
    brand: "Лукойл"
    address: "Шуйское шоссе / Заводская"
    brand_aliases: ["лукойл"]
    location_aliases: ["шуйск", "заводск"]

  # Адрес и алиас "гн" подтверждены пользователем в чате 2026-08-10: "гпн, гн,
  # газпром, газпромнефть, гпн напротив рб, напротив рн - это всё одна АЗС" —
  # расположена напротив rosneft_lososinskoe (РБ/Лососинское шоссе).
  - id: gazprom
    name: "Газпром (напротив РБ / Роснефти на Лососинском, Петрозаводск)"
    brand: "Газпром"
    address: "напротив РБ, Лососинское шоссе, Петрозаводск"
    brand_aliases: ["газпром", "гпн", "гн"]
    location_aliases: []
    default_for_brand: true

  # Вне Петрозаводска — подтверждено пользователем 2026-08-10. Голое
  # "Газпром" по умолчанию уходит в gazprom (Петрозаводск, см. выше и
  # default_for_brand) — эта точка резолвится, только если явно назван
  # ориентир "Березовка".
  - id: gazprom_berezovka
    name: "Газпром (Березовка, вне Петрозаводска)"
    brand: "Газпром"
    address: "Березовка"
    brand_aliases: ["газпром", "гпн", "гн"]
    location_aliases: ["березовк"]

  - id: opti_shuyskoe
    name: "Опти (Шуйское шоссе)"
    brand: "Опти"
    address: "Шуйское шоссе"
    brand_aliases: ["опти"]
    location_aliases: ["шуйск"]

  # Подтверждено пользователем как отдельная вторая точка Опти (не то же
  # самое, что opti_shuyskoe). С этого момента у бренда "Опти" две станции —
  # голое упоминание "опти" без локации больше не резолвится однозначно.
  - id: opti_kazarmenskaya
    name: "Опти (Казарменская)"
    brand: "Опти"
    address: "Казарменская"
    brand_aliases: ["опти"]
    # "на правде" (ул. Правды), "у магнита" — подтверждено 2026-08-10.
    location_aliases: ["казарменск", "правд", "магнит"]

  # Объединена с бывшей отдельной записью tatneft_obiezdnaya — пользователь
  # подтвердил 2026-08-10, что "силикатный"/"объездная"/"сулажгора" — одна
  # и та же станция. Алиас "объездн" также используется у lukoil_lesnoy и
  # rosneft_lesnoy_79 — не конфликт, бренд разный, резолвер матчит независимо.
  # "суоярвск" — тоже эта же точка (подтверждено пользователем 2026-08-10),
  # хотя тот же алиас уже используется у rosneft_lesnoy_79 — не конфликт,
  # бренд разный.
  - id: tatneft_silikatny
    name: "Татнефть (Силикатный / объездная дорога, Сулажгора, Суоярвское шоссе)"
    brand: "Татнефть"
    address: "Силикатный / объездная дорога, Сулажгора, Суоярвское шоссе"
    brand_aliases: ["татнефт", "тн"]
    location_aliases: ["силикатн", "объездн", "сулажгор", "суоярвск"]

  - id: tatneft_klyuchevaya
    name: "Татнефть (Ключевая)"
    brand: "Татнефть"
    address: "Ключевая"
    brand_aliases: ["татнефт", "тн"]
    # "репников" (ул. Репникова) — тоже эта точка, подтверждено 2026-08-10.
    location_aliases: ["ключев", "репников"]

  - id: tatneft_shuyskoe
    name: "Татнефть (Шуйское шоссе)"
    brand: "Татнефть"
    address: "Шуйское шоссе"
    brand_aliases: ["татнефт", "тн"]
    # тоже иногда называют "Татнефть на Заводской" — подтверждено 2026-08-10.
    # Не путать с lukoil_shuyskoe/lukoil_zavodskaya — другой бренд.
    location_aliases: ["шуйск", "заводск"]

  - id: rosneft_lyzhnaya
    name: "Роснефть (Лыжная)"
    brand: "Роснефть"
    address: "Лыжная"
    brand_aliases: ["роснефт", "рн"]
    # "ломоносов" (ул. Ломоносова) — подтверждено пользователем 2026-08-10.
    location_aliases: ["лыжн", "ломоносов"]

  - id: rosneft_lesnoy_79
    name: "Роснефть (Лесной просп. 79 / въезд в Петрозаводск)"
    brand: "Роснефть"
    address: "Лесной просп., 79"
    brand_aliases: ["роснефт", "рн"]
    # он же "суоярвский" (по Суоярвскому шоссе), "на объездной" и "боровая"
    # (ул. Боровая) — разные локальные названия одной и той же точки,
    # подтверждено в чате (в т.ч. пользователем 2026-08-10).
    location_aliases: ["лесн", "суоярвск", "объездн", "боров"]

  - id: rosneft_komsomolsky
    name: "Роснефть (Комсомольский просп. / у Ленты)"
    brand: "Роснефть"
    address: "Комсомольский просп."
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["комсомольск", "лент"]

  # Добавлена по логу: минимум 3 независимых сообщения ("РН лоссосинское
  # около РБ", "У РБ на РН", "РН на Лососинском") — судя по всему, "РБ"
  # (Республиканская больница — подтвердилось полным написанием в чате)
  # ориентир рядом с этой точкой. Не путать с lukoil_lososinskoe — это
  # другой бренд на той же улице. "Высотка" — та же точка, что раньше
  # была одним неподтверждённым упоминанием "Роснефть на высотной" (ждали
  # подтверждений) — подтверждено пользователем 2026-08-10 вместе с
  # остальными деталями (напротив gazprom, у РБ). "Газпром" сознательно
  # НЕ добавлен как алиас локации: он совпал бы с brand_alias самого
  # gazprom как отдельной станции, и сообщение с обоими брендами сразу
  # стало бы неоднозначным между двумя станциями вместо однозначного
  # резолва этой — "рб"/"больниц" и так уже уникальны для неё.
  #
  # "рб"/"больниц" НЕ расшарены с новой rosneft_lesnoy_40 (см. ниже), хотя
  # та тоже "у РБ" — резолвер матчит "встречается ли алиас где угодно в
  # тексте", без учёта близости к номеру дома, так что расшаривание сломало
  # бы даже однозначные, много раз подтверждённые сегодня случаи с этой
  # станцией. Известное ограничение резолвера, не бага здесь; если "Лесной
  # 40" опишут только через "у РБ" без номера — ошибочно уйдёт сюда.
  - id: rosneft_lososinskoe
    name: "Роснефть (Лососинское шоссе, у РБ, у высотки)"
    brand: "Роснефть"
    address: "Лососинское шоссе, у высотки, напротив Газпрома"
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["лососинск", "лоссосинск", "рб", "больниц", "высотк"]

  # Третья точка Роснефти, отдельная и от rosneft_lesnoy_79 (Лесной 79,
  # объездная/суоярвская/боровая), и от rosneft_lososinskoe (Лососинское,
  # высотка) — подтверждено пользователем 2026-08-10. НЕ используем "лесн"/
  # "рб"/"больниц" здесь (см. комментарии у тех станций) — резолвер не умеет
  # матчить алиас рядом с конкретным номером дома, только "встречается ли
  # где-то в тексте", так что расшаривание тех алиасов сломало бы уже
  # проверенные случаи у rosneft_lesnoy_79/rosneft_lososinskoe. Резолвится
  # эта станция только по номерам дома "40"/"38" — сообщения, где эту точку
  # опишут словом "Лесной" без номера или просто "у РБ", уйдут не сюда
  # (см. комментарии выше) или в unresolved. Живой пример реальной ошибки:
  # "На лесном 40 рн перерыв?" сегодня резолвнулся в rosneft_lesnoy_79 —
  # ровно то, что эта запись должна исправить на "40"/"38".
  - id: rosneft_lesnoy_40
    name: "Роснефть (Лесной просп. 40/38, у РБ)"
    brand: "Роснефть"
    address: "Лесной просп., 40 (он же 38)"
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["40", "38"]

  # Вне Петрозаводска — подтверждено пользователем 2026-08-10: "Кондопога
  # и Янишполе — это одна АЗС Лукойл вне Петрозаводска". Раньше Янишполе
  # было намеренно вне газетира (см. пример 2 в llm/prompts.py, обновлён
  # вместе с этой записью) — упоминания уходили в unresolved/null.
  - id: lukoil_yanishpole
    name: "Лукойл (Кондопога / Янишполе, вне Петрозаводска)"
    brand: "Лукойл"
    address: "Кондопога / Янишполе"
    brand_aliases: ["лукойл"]
    location_aliases: ["кондопог", "янишпол"]

  # Добавлена по прямому запросу пользователя 2026-08-13 — реальные
  # сообщения в чате в тот же день ("Китэк что там? Есть еще?", "Китэк ведь
  # в ММС? Если да, то в 19.00 заправлялась...") подтверждают оба названия,
  # раньше уходили в unresolved. Новый бренд, единственная точка — резолвится
  # по одному brand_alias, без уточнения локации (см. правило вверху файла).
  - id: kitek_meliorativny
    name: "Китэк (Мелиоративный)"
    brand: "Китэк"
    address: "Мелиоративный"
    brand_aliases: ["китэк", "китек"]
    location_aliases: ["мелиоративн", "ммс"]
