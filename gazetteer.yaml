# Список известных АЗС. У каждой станции: id (используется в БД/коде),
# name (для будущих ответов бота), brand (канонический бренд — по нему
# считается неоднозначность), address, brand_aliases (по каким словам
# резолвер узнаёт бренд) и location_aliases (по каким словам — именно
# эту точку). pipeline/resolve_station.py матчит станцию, если в тексте
# есть её brand_alias, а если у бренда несколько станций — то ещё и её
# location_alias. Бренд с единственной точкой (пока только Газпром и
# Опти) резолвится по одному brand_alias, без уточнения локации.
stations:
  - id: lukoil_lesnoy
    name: "Лукойл (Лесной просп.)"
    brand: "Лукойл"
    address: "Лесной просп."
    brand_aliases: ["лукойл"]
    location_aliases: ["лесн"]

  - id: lukoil_lososinskoe
    name: "Лукойл (Лососинское шоссе)"
    brand: "Лукойл"
    address: "Лососинское шоссе"
    brand_aliases: ["лукойл"]
    # "лоссосинск" — реальный опечаточный вариант написания, встретился в переписке.
    location_aliases: ["лососинск", "лоссосинск"]

  - id: lukoil_vilga
    name: "Лукойл (Вилга)"
    brand: "Лукойл"
    address: "Вилга"
    brand_aliases: ["лукойл"]
    location_aliases: ["вилг"]

  - id: lukoil_shuyskoe
    name: "Лукойл (Шуйское шоссе)"
    brand: "Лукойл"
    address: "Шуйское шоссе"
    brand_aliases: ["лукойл"]
    location_aliases: ["шуйск"]

  - id: gazprom
    name: "Газпром"
    brand: "Газпром"
    address: null
    brand_aliases: ["газпром", "гпн"]
    location_aliases: []

  - id: opti_shuyskoe
    name: "Опти (Шуйское шоссе)"
    brand: "Опти"
    address: "Шуйское шоссе"
    brand_aliases: ["опти"]
    location_aliases: ["шуйск"]

  # Подтверждено пользователем как отдельная вторая точка Опти (не то же
  # самое, что opti_shuyskoe). С этого момента у бренда "Опти" две станции —
  # голое упоминание "опти" без локации больше не резолвится однозначно.
  - id: opti_kazarmenskaya
    name: "Опти (Казарменская)"
    brand: "Опти"
    address: "Казарменская"
    brand_aliases: ["опти"]
    location_aliases: ["казарменск"]

  - id: tatneft_silikatny
    name: "Татнефть (Силикатный)"
    brand: "Татнефть"
    address: "Силикатный"
    brand_aliases: ["татнефт", "тн"]
    location_aliases: ["силикатн"]

  - id: tatneft_klyuchevaya
    name: "Татнефть (Ключевая)"
    brand: "Татнефть"
    address: "Ключевая"
    brand_aliases: ["татнефт", "тн"]
    location_aliases: ["ключев"]

  - id: tatneft_shuyskoe
    name: "Татнефть (Шуйское шоссе)"
    brand: "Татнефть"
    address: "Шуйское шоссе"
    brand_aliases: ["татнефт", "тн"]
    location_aliases: ["шуйск"]

  - id: rosneft_lyzhnaya
    name: "Роснефть (Лыжная)"
    brand: "Роснефть"
    address: "Лыжная"
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["лыжн"]

  - id: rosneft_lesnoy_79
    name: "Роснефть (Лесной просп. 79 / въезд в Петрозаводск)"
    brand: "Роснефть"
    address: "Лесной просп., 79"
    brand_aliases: ["роснефт", "рн"]
    # он же "суоярвский" (по Суоярвскому шоссе) и "на объездной" — разные
    # локальные названия одной и той же точки, подтверждено в чате.
    location_aliases: ["лесн", "суоярвск", "объездн"]

  - id: rosneft_komsomolsky
    name: "Роснефть (Комсомольский просп. / у Ленты)"
    brand: "Роснефть"
    address: "Комсомольский просп."
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["комсомольск", "лент"]

  # Добавлена по логу: минимум 3 независимых сообщения ("РН лоссосинское
  # около РБ", "У РБ на РН", "РН на Лососинском") — судя по всему, "РБ"
  # (Республиканская больница — подтвердилось полным написанием в чате)
  # ориентир рядом с этой точкой. Не путать с lukoil_lososinskoe — это
  # другой бренд на той же улице.
  - id: rosneft_lososinskoe
    name: "Роснефть (Лососинское шоссе, у РБ)"
    brand: "Роснефть"
    address: "Лососинское шоссе"
    brand_aliases: ["роснефт", "рн"]
    location_aliases: ["лососинск", "лоссосинск", "рб", "больниц"]

  # Подтверждено 2 сообщениями ("Подскажите Лукойл на Заводской есть 92?" +
  # ответ "на табло был только дт").
  - id: lukoil_zavodskaya
    name: "Лукойл (Заводская)"
    brand: "Лукойл"
    address: "Заводская"
    brand_aliases: ["лукойл"]
    location_aliases: ["заводск"]

  # Подтверждено 2 сообщениями ("Татнефть на объездной, есть 92-95?" + ответ
  # с деталями по маркам/очереди). Алиас "объездн" уже используется у
  # rosneft_lesnoy_79 — не конфликт, бренд разный, резолвер матчит их
  # независимо.
  - id: tatneft_obiezdnaya
    name: "Татнефть (объездная дорога)"
    brand: "Татнефть"
    address: "объездная дорога"
    brand_aliases: ["татнефт", "тн"]
    location_aliases: ["объездн"]
