# Список известных АЗС. У каждой станции: id (используется в БД/коде),
# name (для будущих ответов бота), brand, address, aliases — по каким
# фразам резолвер узнаёт станцию в свободном тексте (все строчными).
#
# Роснефть/РН в переписке встречается минимум в 3 разных точках города
# (Лыжная, Лесной просп. 79 / въезд в город, Комсомольский — последняя
# пока не подтверждена, был только вопрос без ответа). Поэтому у бренда
# "Роснефть" нет общих алиасов вида "рн"/"роснефть" без адреса — иначе
# резолвер будет путать разные станции между собой. Голое упоминание
# "РН" без уточнения адреса осознанно уходит в unresolved, пока не
# уточнят, о какой точке речь.
stations:
  - id: lukoil_lesnoy
    name: "Лукойл (Лесной просп.)"
    brand: "Лукойл"
    address: "Лесной просп."
    aliases: ["лукойл лесной", "лесной лукойл"]

  - id: lukoil_lososinskoe
    name: "Лукойл (Лососинское шоссе)"
    brand: "Лукойл"
    address: "Лососинское шоссе"
    aliases: ["лукойл лососинское", "лососинское лукойл"]

  - id: lukoil_vilga
    name: "Лукойл (Вилга)"
    brand: "Лукойл"
    address: "Вилга"
    aliases: ["лукойл вилга", "вилга лукойл"]

  - id: gazprom
    name: "Газпром"
    brand: "Газпром"
    address: null
    aliases: ["газпром", "гпн"]

  - id: tatneft_silikatny
    name: "Татнефть (Силикатный)"
    brand: "Татнефть"
    address: "Силикатный"
    aliases: ["татнефть силикатный", "тн силикатный", "силикатный татнефть"]

  - id: tatneft_klyuchevaya
    name: "Татнефть (Ключевая)"
    brand: "Татнефть"
    address: "Ключевая"
    aliases: ["татнефть ключевая", "тн ключевая", "ключевая татнефть"]

  - id: rosneft_lyzhnaya
    name: "Роснефть (Лыжная)"
    brand: "Роснефть"
    address: "Лыжная"
    aliases: ["роснефть лыжная", "рн лыжная", "лыжная роснефть", "лыжная рн"]

  - id: rosneft_lesnoy_79
    name: "Роснефть (Лесной просп. 79, въезд в Петрозаводск)"
    brand: "Роснефть"
    address: "Лесной просп., 79"
    aliases: ["рн лесной", "роснефть лесной", "лесной 79", "лесной рн"]
